<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; padding: 14px; margin: 0; color: #111; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { font-size: 11px; color: #666; margin: 0 0 12px; }
      label { display: block; font-size: 11px; font-weight: 600; margin: 10px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; }
      button { margin-top: 12px; width: 100%; padding: 8px; font-size: 13px; font-weight: 600; color: #fff; background: #4f46e5; border: none; border-radius: 6px; cursor: pointer; }
      button:hover { background: #4338ca; }
      .status { margin-top: 12px; font-size: 11px; padding: 8px; border-radius: 6px; background: #f4f4f5; }
      .ok { color: #15803d; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>RecallAI Telemetry</h1>
    <p class="sub">Tracks understand vs. write time on LeetCode & Codeforces.</p>

    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" placeholder="http://localhost:8000" />

    <label for="apiKey">API key</label>
    <input id="apiKey" placeholder="rk_…" />

    <button id="save">Save</button>
    <div class="status" id="status">Loading…</div>

    <script src="popup.js"></script>
  </body>
</html>
